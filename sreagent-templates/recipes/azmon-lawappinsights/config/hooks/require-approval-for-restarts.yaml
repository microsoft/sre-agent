metadata:
  name: require-approval-for-restarts
spec:
  eventType: PreToolUse
  hook:
    type: command
    matcher: RunAzCliWriteCommands|RunKubectlWriteCommand|(?:AutoScale|Scale|Restart|RolloutRestart|Modify.*Scale|Resize|Stop|Deallocate).*
    failMode: block
    timeout: 10
    script: |
      #!/usr/bin/env python3
      import json
      import re
      import sys

      event = json.load(sys.stdin)
      if not isinstance(event, dict):
          raise ValueError("Hook event must be an object")
      tool_name = event["tool_name"]
      tool_input = event["tool_input"]
      if not isinstance(tool_name, str) or not tool_name.strip() or not isinstance(tool_input, dict):
          raise ValueError("Expected a nonempty tool_name and an object tool_input")
      builtin_pattern = r"(?:AutoScale|Scale|Restart|RolloutRestart|Modify.*Scale|Resize|Stop|Deallocate).*"
      builtin_action = bool(re.fullmatch(builtin_pattern, tool_name))
      is_cli = tool_name in {"RunAzCliWriteCommands", "RunKubectlWriteCommand"}
      command = tool_input["command"] if is_cli else ""
      if is_cli and (not isinstance(command, str) or not command.strip()):
          raise ValueError("tool_input.command must be a nonempty string")
      removal = bool(re.fullmatch(r"(?:APIM)?RemoveNSGRule.*", tool_name))
      if ((removal or re.search(r"\b(delete|remove)\b", command, re.IGNORECASE))
              and re.search(r"prod|prd", json.dumps(tool_input), re.IGNORECASE)):
          print(json.dumps({
              "ok": False,
              "reason": "Deleting or removing production resources is blocked.",
              "hookSpecificOutput": {"permissionDecision": "deny"}
          }))
          sys.exit(0)
      capacity = (
          re.search(r"\b(update|patch|set|apply)\b", command, re.IGNORECASE)
          and re.search(r"sku\.capacity|--(?:max-count|min-count|node-count|number-of-workers)\b|\breplicas\b", command, re.IGNORECASE)
      )
      if builtin_action or capacity or re.search(r"\b(restart|stop|deallocate|scale|resize)\b", command, re.IGNORECASE):
          print(json.dumps({"ok": True, "hookSpecificOutput": {
              "permissionDecision": "ask",
              "permissionDecisionReason": "Approve the restart, scaling or resize operation?"
          }}))
      else:
          print(json.dumps({"ok": True}))
  enabled: true
