api_version: azuresre.ai/v2
kind: ScheduledTask
metadata:
  name: SkuAvailabilityAudit
spec:
  name: SkuAvailabilityAudit
  description: Weekly audit of regional SKU availability and restrictions that could block deployments
  schedule: 30 7 * * 3
  mode: Review
  agent: finops-practitioner
  prompt: '# SKU Availability Audit


    ## Phase 0: Preparation


    Before starting, read all documents in the knowledge base. Pay special attention to deployment region notes, restricted SKU findings, and planned capacity requests.

    Output style: Label measured, derived, and estimated evidence; cite each source or derivation; state exact scope and time period; organize findings by FinOps capability; include risk thresholds, confidence, caveats, and required disclaimers.

    Tool routing and delivery guard: This scheduled task is owned by `finops-practitioner`, which has `SearchMemory`, its assigned `azure-resource-manager-mcp_*` Cost Management and Pricing tools, its assigned Python ARM tools (`resource-graph-query`, `benefit-recommendations`, `deploy-budget`, `deploy-bulk-budgets`, `deploy-anomaly-alert`, `deploy-bulk-anomaly-alerts`, and `suppress-advisor-recommendations`), its visualization tools (`PlotBarChart`, `PlotPieChart`, `PlotAreaChartWithCorrelation`), and its Microsoft Teams delivery tools (`GetMessagesFromChannel`, `PostMessageToConversation`, `PostCardToConversation`, `ReplyWithMessageToConversation`, `ReplyWithCardToConversation`, `UpdateCardInConversation`). Use the `Task` system tool to invoke `azure-capacity-manager` for quota, capacity reservation group, SKU availability, zone mapping, database service quota, and benefit recommendation Python tools (`vm-quota-usage`, `non-compute-quotas`, `db-service-quotas`, `capacity-reservation-groups`, `zone-mapping`, `sku-availability`, `benefit-recommendations`), and invoke `chief-financial-officer` for executive finance framing. Pass the full task scope, evidence already collected, open questions, and desired output shape with each `Task` invocation. Check available visualization tools once per run and use `PlotBarChart`, `PlotPieChart`, or `PlotAreaChartWithCorrelation` to generate charts for key findings; if no visualization tool is available, provide the data as a chart-ready table. Complete the report and chart artifacts before delivery. When a Microsoft Teams connector/channel is configured, `finops-practitioner` makes one final `PostMessageToConversation` attempt to the configured Teams channel. If a configured Teams delivery attempt fails, mark the task/run failed instead of degrading to local output or probing alternate paths. If Teams delivery is not configured or available, render the completed report in the run output and state that Teams delivery was skipped.



    Orchestration rule: This scheduled task is owned by `finops-practitioner`. Delegate SKU availability evidence collection and specialist analysis to `azure-capacity-manager`; do not try to run capacity tools directly from the practitioner. When the specialist returns evidence, assemble the final FinOps report, apply the reporting requirements in this task, generate supported visualizations, and deliver the completed output through configured connectors.

    Ask `azure-capacity-manager` to load its capacity-management guidance and use the agent system-managed identity for Python tool authentication.


    ## Specialist tools to request from `azure-capacity-manager`

    - Ask `azure-capacity-manager` to run `sku-availability` with `subscription_id`, `location`, and optional `sku_filter` for Azure Compute SKU availability, zones, and restrictions.


    ## 1. Establish region and SKU scope


    Identify deployment regions and priority VM SKU families from knowledge base notes and prior reports. If no priority SKU list exists, audit commonly deployed VM families and explicitly state the assumed scope.


    ## 2. Collect SKU availability


    Ask `azure-capacity-manager` to run `sku-availability` for each scoped subscription and region using `subscription_id`, `location`, and optional `sku_filter`.


    - Capture total Compute SKUs, restricted SKUs, restriction reason codes, zone availability, and restriction values.



    ## 3. Analyze deployment blockers


    Identify restricted Compute SKUs that could block future deployments, scaling, zone alignment, or capacity reservation planning. Group findings by reason code when available, region, zone, subscription, and family or SKU name.

    Classify each observed failure as quota exhaustion, hard access or offer restriction, over-constrained placement, or transient inventory stockout. `SkuNotAvailable` and `NotAvailableForSubscription` are hard restrictions unless live evidence proves otherwise; do not recommend retries for them. Treat `AllocationFailed` and `ZonalAllocationFailed` as transient stockout candidates only after quota and request constraints are checked.

    Record whether each planned VM SKU and deployment shape supports CRGs. Include unsupported GPU/HPC families, Spot VMs, availability sets, dedicated hosts, proximity placement groups, and other documented reservation constraints.


    ## 4. Recommend actions


    Recommend whether to request quota, change SKU family, change region, adjust deployment zone, or escalate to Azure capacity planning. For every critical workload fallback, record architecture compatibility, cost impact, quota/access readiness, and latest non-production deployment-test status. Include uncertainty where planned demand is not documented.


    ## Report format


    Produce a markdown report with an executive summary, a restricted SKU table, a reason-code summary table, deployment blocker notes, and recommended mitigation actions.


    ## Persistence


    **Microsoft Teams (results only):** Post the final report to our Teams channel using `PostMessageToConversation` when configured. Do not post intermediate results. If Teams delivery is not configured or available, return the completed report in the run output with a note stating that Teams delivery was skipped. If a configured Teams final delivery attempt fails, do not retry or probe alternate delivery paths; mark the task/run failed.


    **Knowledge (#remember):** Save operational findings using #remember for future reference. Do not commit task reports, financial figures, cost amounts, or customer financial data to git or the knowledge base. Financial detail goes to configured Microsoft Teams delivery only.


    ## Visualizations


    Before delivery, `azure-capacity-manager` or `finops-practitioner` generates charts for key findings using `PlotBarChart`, `PlotPieChart`, or `PlotAreaChartWithCorrelation`. Only `azure-capacity-manager` may use `ExecutePythonCode` as a fallback for capacity evidence. If no visualization tool is available, provide the data as a chart-ready table. Include at minimum a restricted SKU count by region chart and a restriction reason-code chart where the data supports it. Verify each generated chart non-visually before embedding by checking the output file exists, has non-zero size, opens as an image, and reports expected dimensions and metadata through code interpreter filesystem or image-library checks. Do not use visual inspection as the verification gate; regenerate or omit any chart that fails these checks and state why. Embed chart images inline in the Microsoft Teams message alongside text tables.'
