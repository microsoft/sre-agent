api_version: azuresre.ai/v2
kind: ScheduledTask
metadata:
  name: Monthly
spec:
  name: Monthly
  description: Month-over-month cost analysis with Azure Cost Management and ARM MCP tools
  schedule: 15 17 5 * *
  mode: Review
  agent: finops-practitioner
  prompt: |-
    # Monthly Cost Analysis

    ## Phase 0: Preparation

    Before starting, search available knowledge and prior memory for relevant context, known issues, and previous findings.
    Output style: Label measured, derived, and estimated evidence; cite each source or derivation; state exact scope and time period; organize findings by FinOps capability; include risk thresholds, confidence, caveats, and required disclaimers.
    Tool routing and delivery guard: This scheduled task is owned by `finops-practitioner`, which has `SearchMemory`, its assigned `azure-resource-manager-mcp_*` Cost Management and Pricing tools, its assigned Python ARM tools (`resource-graph-query`, `benefit-recommendations`, `deploy-budget`, `deploy-bulk-budgets`, `deploy-anomaly-alert`, `deploy-bulk-anomaly-alerts`, and `suppress-advisor-recommendations`), its visualization tools (`PlotBarChart`, `PlotPieChart`, `PlotAreaChartWithCorrelation`), and its Microsoft Teams delivery tools (`GetMessagesFromChannel`, `PostMessageToConversation`, `PostCardToConversation`, `ReplyWithMessageToConversation`, `ReplyWithCardToConversation`, `UpdateCardInConversation`). Use the `Task` system tool to invoke `azure-capacity-manager` for quota, capacity reservation group, SKU availability, zone mapping, database service quota, and benefit recommendation Python tools (`vm-quota-usage`, `non-compute-quotas`, `db-service-quotas`, `capacity-reservation-groups`, `zone-mapping`, `sku-availability`, `benefit-recommendations`), and invoke `chief-financial-officer` for executive finance framing. Pass the full task scope, evidence already collected, open questions, and desired output shape with each `Task` invocation. Check available visualization tools once per run and use `PlotBarChart`, `PlotPieChart`, or `PlotAreaChartWithCorrelation` to generate charts for key findings; if no visualization tool is available, provide the data as a chart-ready table. Complete the report and chart artifacts before delivery. When a Microsoft Teams connector/channel is configured, `finops-practitioner` makes one final `PostMessageToConversation` attempt to the configured Teams channel. If a configured Teams delivery attempt fails, mark the task/run failed instead of degrading to local output or probing alternate paths. If Teams delivery is not configured or available, render the completed report in the run output and state that Teams delivery was skipped.





    Perform a comprehensive analysis for the most recently completed calendar month and a forecast for the next calendar month. If the knowledge base documents a fiscal calendar, include the fiscal mapping and state the reporting boundary explicitly. Each run builds on previous runs — prior research, notes, and results carry forward.
    ## Specialist evidence requests for this task

    `finops-practitioner` runs the Azure Cost Management and ARM tools below directly. Ask `azure-capacity-manager` to run `vm-quota-usage` with `subscription_id` and `location` for relevant VM families and regions.

    ## Phase 1: Data Collection

    Use #remember to record operational observations, not financial figures. Check the returned data periods and completeness; state any freshness or coverage limitations.

    ### 1.1 Cost trends and allocation

    Run `azure-resource-manager-mcp_query_costs` for the 12-month monthly trend, top 20 services, top resource groups, regional distribution, top 20 resource types, daily 90-day spike and volatility analysis, and charge-type and publisher breakdown. Compare the completed month with prior periods. Investigate spikes and report missing or incomplete data.

    Run `azure-resource-manager-mcp_list_dimensions` and `resource-graph-query` to assess available allocation dimensions and tag coverage, including team, product, application, and environment.

    ### 1.2 Alerts and budgets

    Run `azure-resource-manager-mcp_list_alerts` and `azure-resource-manager-mcp_list_budgets` to review anomaly and budget alerts and their coverage.

    ### 1.3 Commitment performance and recommendations

    Run `azure-resource-manager-mcp_list_benefit_utilization`, `azure-resource-manager-mcp_get_benefit_recommendations`, `benefit-recommendations`, and `azure-resource-manager-mcp_list_reservation_transactions` to assess commitment utilization, savings, recommendations, and reservation transactions. Calculate savings or coverage only where the evidence supports it; state assumptions and missing fields.

    ### 1.4 Forecast and pricing

    Run `azure-resource-manager-mcp_forecast_costs` for a 90-day forecast and assess confidence. Run `azure-resource-manager-mcp_get_retail_prices`, `azure-resource-manager-mcp_start_pricesheet_download`, and `azure-resource-manager-mcp_get_pricesheet_status` for price benchmarking. Compare retail, contracted, and effective prices only when comparable data is available.

    ### 1.5 FinOps scorecard

    Summarize supported measurements by FinOps capability, including allocation, anomaly management, rate optimization, unit economics, and usage optimization. Distinguish measured from derived results and cite sources; label unsupported metrics and incomplete purchase data as limitations rather than assuming zero.

    **Checkpoint:** Confirm all available data is collected and gaps are documented before strategic analysis.

    ## Phase 2: Strategic Analysis

    ### 2.1 ROI and Business Impact
    Calculate ROI = Annual Savings / Implementation Cost for each optimization opportunity. Determine payback period. Compare against industry benchmarks (cost variance 3-5%, RI coverage 60-70%). Create opportunity matrix.

    ### 2.2 Quick Wins
    Filter opportunities meeting ALL criteria: implementation < 30 days AND risk = low AND savings > $1000/month. Prioritize: commitment purchases, right-sizing, auto-shutdown.

    ### 2.3 Detailed Findings
    Document 7 sections: (1) Cost Analysis, (2) Savings Analysis, (3) Optimization Opportunities, (4) Governance & Risk, (5) Strategic Market Positioning, (6) Temporal Themes, (7) Implementation Roadmap. No raw JSON references — executive-level language only.

    ### 2.4 Recommendations with Performance Grading
    Assign a letter grade (A+ to F) with percentile ranking. Build prioritized actions: Immediate (<30 days), Short-term (30-90 days), Long-term (90+ days). Include dollar savings amount, confidence %, and clear owner for each.

    ### 2.5 Implementation Roadmap
    Phase 1 (30 days): quick wins. Phase 2 (60 days): commitments. Phase 3 (90 days): architecture. Include dependencies, risks, success metrics for each phase.

    **Checkpoint:** Validate all deliverables before formatting.

    ## Phase 3: Report Formatting

    Format as a professional, scannable report. Use tables, emoji indicators (📊 💰 🚨 🎯 🏆), bold dollar amounts. Include multi-scenario forecasts (Conservative/Expected/Optimistic), YoY/MoM comparisons, and percentile positioning.

    Do not stop or yield until the report is complete and ready for the FinOps team.

    ## Phase 4: Deliver


    **Visualizations:** Before delivery, `finops-practitioner` generates charts for key findings using `PlotBarChart`, `PlotPieChart`, or `PlotAreaChartWithCorrelation`; for capacity evidence, `azure-capacity-manager` generates the charts and may use `ExecutePythonCode` only as a fallback. If visualization tools are unavailable, provide chart-ready tables. Include at minimum one trend chart and one comparison chart where the data supports it. Verify each chart file non-visually by checking that it exists, has non-zero size, opens as an image, and has the expected dimensions and metadata. Regenerate or omit a chart that fails these checks and state why. Embed chart images inline in the Microsoft Teams message alongside text tables.

    **Microsoft Teams (financial results only):** Post the final report to our Teams channel using `PostMessageToConversation` when configured. Do not post intermediate results. If Teams delivery is not configured or available, return the completed report in the run output with a note stating that Teams delivery was skipped. If a configured Teams final delivery attempt fails, do not retry or probe alternate delivery paths; mark the task/run failed.

    **Knowledge base (operational learnings only):** Save any new operational insights to the knowledge base — tool errors encountered, workarounds discovered, data quality observations, query patterns that worked or failed. Never save financial figures, cost amounts, savings numbers, or any customer financial data to the knowledge base. Financial detail goes to configured Microsoft Teams delivery only.
