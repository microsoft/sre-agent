apiVersion: v1
kind: ConfigMap
metadata:
  name: ama-metrics-settings-configmap
  namespace: kube-system
data:
  config: |-
    [prometheus-collector-settings]
      [prometheus-collector-settings.cluster-metrics]
        [prometheus-collector-settings.cluster-metrics.pod-annotation-based-scraping]
          enabled = true
          pod-annotation-based-scraping-interval = "30s"
          pod-annotation-based-scraping-namespace-regex = "sre-demo"
