<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1300" viewBox="0 0 1200 1300" role="img" aria-labelledby="title description">
  <title id="title">Azure SRE Agent Onboarding Lab architecture and incident flow</title>
  <desc id="description">Four-stage flowchart showing ticket requests, telemetry and alerting, autonomous SRE Agent investigation, operator-owned fault control, GitHub and email follow-ups, and proactive health analysis.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #64748b; }
      .stage-title { font-size: 17px; font-weight: 700; }
      .stage-number { font-size: 17px; font-weight: 800; fill: #ffffff; }
      .node-title { font-size: 16px; font-weight: 700; }
      .node-detail { font-size: 13px; fill: #64748b; }
      .edge-label { font-size: 12px; font-weight: 600; fill: #475569; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .human-arrow { fill: none; stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .guide { fill: none; stroke: #059669; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .node { fill: #ffffff; stroke-width: 2; rx: 10; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1200" height="1300" fill="#f8fafc"/>
  <text x="40" y="48" class="title">Azure SRE Agent Onboarding Lab: from ticket request to incident response</text>
  <text x="40" y="72" class="subtitle">Solid arrows are automated. The dashed amber arrow is controlled by the lab participant.</text>

  <!-- Stage 1: ticket request -->
  <rect x="30" y="100" width="1140" height="245" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <circle cx="65" cy="136" r="18" fill="#2563eb"/>
  <text x="65" y="142" text-anchor="middle" class="stage-number">1</text>
  <text x="94" y="142" class="stage-title" fill="#1d4ed8">Ticket request and database path</text>

  <rect x="70" y="178" width="200" height="82" class="node" stroke="#60a5fa"/>
  <text x="170" y="211" text-anchor="middle" class="node-title">Concertgoer</text>
  <text x="170" y="235" text-anchor="middle" class="node-detail">or lab participant</text>

  <rect x="350" y="178" width="220" height="82" class="node" stroke="#60a5fa"/>
  <text x="460" y="211" text-anchor="middle" class="node-title">Ticketing app</text>
  <text x="460" y="235" text-anchor="middle" class="node-detail">Node.js on App Service</text>

  <rect x="650" y="178" width="200" height="82" class="node" stroke="#60a5fa"/>
  <text x="750" y="211" text-anchor="middle" class="node-title">App subnet NSG</text>
  <text x="750" y="235" text-anchor="middle" class="node-detail">Allows TCP 5432</text>

  <rect x="930" y="178" width="200" height="82" class="node" stroke="#60a5fa"/>
  <text x="1030" y="211" text-anchor="middle" class="node-title">PostgreSQL</text>
  <text x="1030" y="235" text-anchor="middle" class="node-detail">Delegated private subnet</text>

  <path d="M270 219 H350" class="arrow"/>
  <path d="M570 219 H650" class="arrow"/>
  <path d="M850 219 H930" class="arrow"/>
  <text x="310" y="207" text-anchor="middle" class="edge-label">Reserve</text>
  <text x="610" y="207" text-anchor="middle" class="edge-label">Connect</text>
  <text x="890" y="207" text-anchor="middle" class="edge-label">TCP 5432</text>

  <rect x="610" y="281" width="280" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="750" y="307" text-anchor="middle" class="node-title" fill="#92400e">Operator: fault.ps1 inject / reset</text>
  <path d="M750 281 V263" class="human-arrow"/>

  <!-- Stage 2: detection -->
  <rect x="30" y="365" width="1140" height="185" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <circle cx="65" cy="401" r="18" fill="#ea580c"/>
  <text x="65" y="407" text-anchor="middle" class="stage-number">2</text>
  <text x="94" y="407" class="stage-title" fill="#c2410c">Detect customer impact</text>

  <rect x="185" y="442" width="250" height="72" class="node" stroke="#fb923c"/>
  <text x="310" y="471" text-anchor="middle" class="node-title">Application Insights</text>
  <text x="310" y="493" text-anchor="middle" class="node-detail">Requests and dependencies</text>

  <rect x="500" y="442" width="250" height="72" class="node" stroke="#fb923c"/>
  <text x="625" y="471" text-anchor="middle" class="node-title">Failed reservations</text>
  <text x="625" y="493" text-anchor="middle" class="node-detail">POST /checkout returns 503</text>

  <rect x="815" y="442" width="250" height="72" class="node" stroke="#fb923c"/>
  <text x="940" y="471" text-anchor="middle" class="node-title">Azure Monitor alert</text>
  <text x="940" y="493" text-anchor="middle" class="node-detail">New and Fired</text>

  <path d="M435 478 H500" class="arrow"/>
  <path d="M750 478 H815" class="arrow"/>
  <path d="M460 260 V380 H310 V442" class="arrow"/>
  <text x="476" y="360" class="edge-label">Telemetry</text>

  <!-- Stage 3: autonomous response -->
  <rect x="30" y="570" width="1140" height="535" rx="18" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <circle cx="65" cy="606" r="18" fill="#059669"/>
  <text x="65" y="612" text-anchor="middle" class="stage-number">3</text>
  <text x="94" y="612" class="stage-title" fill="#047857">Investigate and communicate automatically</text>

  <rect x="120" y="650" width="250" height="78" class="node" stroke="#34d399"/>
  <text x="245" y="680" text-anchor="middle" class="node-title">Autonomous response plan</text>
  <text x="245" y="703" text-anchor="middle" class="node-detail">checkout-database-connectivity</text>

  <rect x="475" y="650" width="250" height="78" class="node" stroke="#34d399"/>
  <text x="600" y="680" text-anchor="middle" class="node-title">Incident commander</text>
  <text x="600" y="703" text-anchor="middle" class="node-detail">Delegates in parallel</text>

  <rect x="820" y="650" width="260" height="78" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="950" y="680" text-anchor="middle" class="node-title">Context and guardrails</text>
  <text x="950" y="703" text-anchor="middle" class="node-detail">Source, skills, permissions, hook</text>

  <path d="M940 514 V610 H245 V650" class="arrow"/>
  <path d="M370 689 H475" class="arrow"/>
  <path d="M820 689 H725" class="guide"/>

  <rect x="75" y="800" width="290" height="82" class="node" stroke="#34d399"/>
  <text x="220" y="831" text-anchor="middle" class="node-title">Application investigator</text>
  <text x="220" y="854" text-anchor="middle" class="node-detail">Impact, failures, latency</text>

  <rect x="455" y="800" width="290" height="82" class="node" stroke="#34d399"/>
  <text x="600" y="831" text-anchor="middle" class="node-title">PostgreSQL investigator</text>
  <text x="600" y="854" text-anchor="middle" class="node-detail">Database health and metrics</text>

  <rect x="835" y="800" width="290" height="82" class="node" stroke="#34d399"/>
  <text x="980" y="831" text-anchor="middle" class="node-title">Network investigator</text>
  <text x="980" y="854" text-anchor="middle" class="node-detail">Private path and NSG rules</text>

  <path d="M600 728 V766 H220 V800" class="arrow"/>
  <path d="M600 728 V800" class="arrow"/>
  <path d="M600 766 H980 V800" class="arrow"/>

  <rect x="475" y="930" width="250" height="72" class="node" stroke="#34d399"/>
  <text x="600" y="960" text-anchor="middle" class="node-title">Correlated diagnosis</text>
  <text x="600" y="982" text-anchor="middle" class="node-detail">Evidence and recommended reset</text>

  <path d="M220 882 V910 H600 V930" class="arrow"/>
  <path d="M600 882 V930" class="arrow"/>
  <path d="M980 882 V910 H600 V930" class="arrow"/>

  <rect x="280" y="1032" width="250" height="54" rx="10" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="405" y="1065" text-anchor="middle" class="node-title">GitHub incident issue</text>
  <rect x="670" y="1032" width="250" height="54" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <text x="795" y="1065" text-anchor="middle" class="node-title">Email summary</text>
  <path d="M600 1002 V1017 H405 V1032" class="arrow"/>
  <path d="M600 1017 H795 V1032" class="arrow"/>

  <!-- Stage 4: proactive health -->
  <rect x="30" y="1125" width="1140" height="145" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <circle cx="65" cy="1161" r="18" fill="#7c3aed"/>
  <text x="65" y="1167" text-anchor="middle" class="stage-number">4</text>
  <text x="94" y="1167" class="stage-title" fill="#6d28d9">Optional proactive health check</text>

  <rect x="165" y="1192" width="230" height="58" class="node" stroke="#a78bfa"/>
  <text x="280" y="1227" text-anchor="middle" class="node-title">Paused health task</text>
  <rect x="485" y="1192" width="230" height="58" class="node" stroke="#a78bfa"/>
  <text x="600" y="1227" text-anchor="middle" class="node-title">Service health analyst</text>
  <rect x="805" y="1192" width="230" height="58" class="node" stroke="#a78bfa"/>
  <text x="920" y="1217" text-anchor="middle" class="node-title">Application Insights</text>
  <text x="920" y="1238" text-anchor="middle" class="node-detail">Read-only analysis</text>
  <path d="M395 1221 H485" class="arrow"/>
  <path d="M715 1221 H805" class="arrow"/>
</svg>