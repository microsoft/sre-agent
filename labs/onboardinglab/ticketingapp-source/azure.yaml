# yaml-language-server: $schema=https://aka.ms/azure.yaml.json
name: onboardinglab
infra:
  provider: bicep
  path: .
services:
  checkout:
    project: ./app
    language: js
    host: appservice
hooks:
  postdeploy:
    windows:
      shell: pwsh
      run: ./post-deploy.ps1
      interactive: true
    posix:
      shell: sh
      run: ./post-deploy.sh
      interactive: true